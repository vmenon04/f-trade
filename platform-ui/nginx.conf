# A template: when the container starts, the nginx image fills in ${LOGO_DEV_CRED_KEY} from the environment
# (docker-compose.yml passes it from the root .env), so the key is never baked into the image
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The services behind are looked up again every few seconds (Docker's own DNS), not once when nginx starts:
    # a container that compose recreates gets a new address, and nginx would go on sending to the old one and
    # answer 502 until it was restarted itself. nginx only looks a name up again when it is in a variable.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /v1/ {
        set $api http://api:8080;
        proxy_pass $api;
    }

    location /auth/ {
        set $auth http://auth-service:3000;
        proxy_pass $auth;
    }

    # the analyst and admin pages' data (reporting-api); it checks the login token itself
    location /api/ {
        set $reporting http://reporting-api:8050;
        proxy_pass $reporting;
    }

    # /logo/ticker/AAPL -> https://img.logo.dev/ticker/AAPL with the publishable key added, like the dev proxy
    # (proxy.conf.mjs). img.logo.dev is served over TLS by a CDN, which needs the server name (SNI) and Host header
    location /logo/ {
        rewrite ^/logo/(.*)$ /$1?token=${LOGO_DEV_CRED_KEY}&format=png&size=64 break;
        proxy_pass https://img.logo.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host img.logo.dev;
    }
}
